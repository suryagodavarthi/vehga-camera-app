name: pronto_camera_app
description: "Vehga field camera app: agency login, vehicle photo capture with location watermark, synced to whichever company the case belongs to (Vehga or Pronto)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  camera: ^0.12.0+1
  ffmpeg_kit_flutter_new: ^4.4.2
  flutter:
    sdk: flutter
  gal: ^2.3.2
  geocoding: ^4.0.0
  geolocator: ^14.0.3
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.9.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#087d7e"
  adaptive_icon_foreground: assets/app_icon_fg.png
